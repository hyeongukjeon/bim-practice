<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BIM전문가 2급 랜덤 문제</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow">BIM전문가 2급</p>
          <h1>랜덤 문제 풀이</h1>
        </div>
        <button id="resetButton" class="icon-button" type="button" aria-label="문제 순서 다시 섞기" title="문제 순서 다시 섞기">
          ↻
        </button>
      </header>

      <section class="status" aria-label="풀이 현황">
        <span id="positionText">1 / 340</span>
        <span id="scoreText">정답 0 · 오답 0</span>
      </section>

      <section class="question-panel">
        <div class="meta-row">
          <span id="sourceText" class="source"></span>
          <span id="numberText" class="number"></span>
        </div>
        <h2 id="questionText"></h2>
      </section>

      <section id="options" class="options" aria-label="보기"></section>

      <div id="resultText" class="result" role="status"></div>

      <nav class="bottom-nav" aria-label="문제 이동">
        <button id="prevButton" class="nav-button" type="button">
          <span aria-hidden="true">‹</span>
          이전문제
        </button>
        <button id="nextButton" class="nav-button primary" type="button">
          다음문제
          <span aria-hidden="true">›</span>
        </button>
      </nav>
    </main>

    <script src="data/questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
